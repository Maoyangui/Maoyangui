<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 392" width="1200" height="392" role="img" aria-label="How I build: dry-run then apply; fail closed; one binary, one file; proven on real machines">
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="392"><stop offset="0" stop-color="#6a44f2"/><stop offset=".55" stop-color="#2f8bff"/><stop offset="1" stop-color="#18e3e8"/></linearGradient><radialGradient id="rv"><stop offset="0" stop-color="#6a44f2" stop-opacity="1"/><stop offset="1" stop-color="#6a44f2" stop-opacity="0"/></radialGradient><clipPath id="tc0"><rect x="20" y="52" width="570" height="150" rx="20"/></clipPath><clipPath id="tc1"><rect x="610" y="52" width="570" height="150" rx="20"/></clipPath><clipPath id="tc2"><rect x="20" y="222" width="570" height="150" rx="20"/></clipPath><clipPath id="tc3"><rect x="610" y="222" width="570" height="150" rx="20"/></clipPath>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a44f2" stop-opacity="0"/><stop offset=".5" stop-color="#18e3e8"/><stop offset="1" stop-color="#18e3e8" stop-opacity="0"/></linearGradient>
<style>.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}.mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{animation:sw 5.2s ease-in-out infinite}@keyframes sw{0%,100%{transform:translateX(-200px)}50%{transform:translateX(200px)}}</style></defs>
<text x="24" y="30" class="mono" font-size="15" letter-spacing="3" fill="url(#g)">03 — HOW I BUILD</text><rect x="20" y="52" width="570" height="150" rx="20" fill="rgba(255,255,255,0.75)" stroke="rgba(15,23,42,0.12)"/><text x="564" y="180" text-anchor="end" class="sans" font-size="104" font-weight="800" fill="none" stroke="url(#g)" stroke-width="1.4" opacity=".22">01</text><g clip-path="url(#tc0)"><rect class="sw" style="animation-delay:0s" x="145" y="52" width="320" height="1.6" fill="url(#top)"/></g><circle cx="80" cy="127" r="46" fill="url(#rv)" opacity=".5"/><rect x="48" y="95" width="64" height="64" rx="18" fill="#ffffff" stroke="url(#g)" stroke-width="1.8"/><g transform="translate(80 127)"><g><path d="M-14 -6 A15 15 0 1 1 -11 10" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/><path d="M-19 -13 L-14 -5 L-6 -9" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="6s" repeatCount="indefinite"/></g></g><text x="144" y="110" class="sans" font-size="25" font-weight="750" letter-spacing="-0.4" fill="#0a0f1f">Dry-run, then apply</text><text x="144" y="144" class="sans" font-size="17.5" fill="#4c566c">Every change is dry-run by sing-box first.</text><text x="144" y="170" class="sans" font-size="17.5" fill="#4c566c">Failures never go live; breakage rolls back.</text><rect x="610" y="52" width="570" height="150" rx="20" fill="rgba(255,255,255,0.75)" stroke="rgba(15,23,42,0.12)"/><text x="1154" y="180" text-anchor="end" class="sans" font-size="104" font-weight="800" fill="none" stroke="url(#g)" stroke-width="1.4" opacity=".22">02</text><g clip-path="url(#tc1)"><rect class="sw" style="animation-delay:-1.3s" x="735" y="52" width="320" height="1.6" fill="url(#top)"/></g><circle cx="670" cy="127" r="46" fill="url(#rv)" opacity=".5"/><rect x="638" y="95" width="64" height="64" rx="18" fill="#ffffff" stroke="url(#g)" stroke-width="1.8"/><path d="M670 109 L685 115 V127 C685 137 678 143 670 147 C662 143 655 137 655 127 V115 Z" fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/><path d="M664 128 l4.5 4.5 8-9" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="670" cy="127" r="22" fill="none" stroke="url(#g)" stroke-width="1.5"><animate attributeName="r" values="20;34" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/></circle><text x="734" y="110" class="sans" font-size="25" font-weight="750" letter-spacing="-0.4" fill="#0a0f1f">Fail closed</text><text x="734" y="144" class="sans" font-size="17.5" fill="#4c566c">Strict global lets nothing out but the</text><text x="734" y="170" class="sans" font-size="17.5" fill="#4c566c">tunnel — not DNS, not after a crash.</text><rect x="20" y="222" width="570" height="150" rx="20" fill="rgba(255,255,255,0.75)" stroke="rgba(15,23,42,0.12)"/><text x="564" y="350" text-anchor="end" class="sans" font-size="104" font-weight="800" fill="none" stroke="url(#g)" stroke-width="1.4" opacity=".22">03</text><g clip-path="url(#tc2)"><rect class="sw" style="animation-delay:-2.6s" x="145" y="222" width="320" height="1.6" fill="url(#top)"/></g><circle cx="80" cy="297" r="46" fill="url(#rv)" opacity=".5"/><rect x="48" y="265" width="64" height="64" rx="18" fill="#ffffff" stroke="url(#g)" stroke-width="1.8"/><g><path d="M80 279 L96 288 L80 297 L64 288 Z" fill="url(#g)" opacity=".85"/><path d="M80 279 L96 288 V307 L80 316 L64 307 V288 Z M80 297 V316" fill="none" stroke="url(#g)" stroke-width="2.6" stroke-linejoin="round"/><animateTransform attributeName="transform" type="translate" values="0 2;0 -3;0 2" dur="3.2s" repeatCount="indefinite"/></g><text x="144" y="280" class="sans" font-size="25" font-weight="750" letter-spacing="-0.4" fill="#0a0f1f">One binary, one file</text><text x="144" y="314" class="sans" font-size="17.5" fill="#4c566c">One Go binary with sing-box embedded,</text><text x="144" y="340" class="sans" font-size="17.5" fill="#4c566c">one SQLite file to back up and move.</text><rect x="610" y="222" width="570" height="150" rx="20" fill="rgba(255,255,255,0.75)" stroke="rgba(15,23,42,0.12)"/><text x="1154" y="350" text-anchor="end" class="sans" font-size="104" font-weight="800" fill="none" stroke="url(#g)" stroke-width="1.4" opacity=".22">04</text><g clip-path="url(#tc3)"><rect class="sw" style="animation-delay:-3.9000000000000004s" x="735" y="222" width="320" height="1.6" fill="url(#top)"/></g><circle cx="670" cy="297" r="46" fill="url(#rv)" opacity=".5"/><rect x="638" y="265" width="64" height="64" rx="18" fill="#ffffff" stroke="url(#g)" stroke-width="1.8"/><circle cx="670" cy="297" r="17" fill="none" stroke="url(#g)" stroke-width="3" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90 670 297)"><animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;0.35;0.85;1" dur="4s" repeatCount="indefinite"/></circle><path d="M663 297 l5 5 9-10" fill="none" stroke="url(#g)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100 100"><animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;0.3;0.5;0.85;1" dur="4s" repeatCount="indefinite"/></path><text x="734" y="280" class="sans" font-size="25" font-weight="750" letter-spacing="-0.4" fill="#0a0f1f">Proven on real machines</text><text x="734" y="314" class="sans" font-size="17.5" fill="#4c566c">Every change is re-audited and run on real</text><text x="734" y="340" class="sans" font-size="17.5" fill="#4c566c">servers and devices before it ships.</text>
</svg>
